# Builds and publishes docker images for the following:
#   - Windows Server 2022
#   - Windows Server 2025
#   - MacOS/Linux (Ubuntu Noble, Arm & Intel)
#   - MacOS/Linux (Azure Linux, Arm & Intel)
#   - A multi-arch manifest.

name: Build and Publish Docker Images

on:
  workflow_dispatch:
  schedule:
  - cron: '0 0 15 * *'
  workflow_run:
    workflows: ["Package and Upload Release Asset"]
    types:
      - completed

jobs:

  getReleaseVersion:
    name: Get Latest Release Version
    runs-on: windows-2022
    outputs:
        release_version: ${{ steps.latestVersion.outputs.release }}
        is_v2_plus: ${{ steps.versionGate.outputs.is_v2_plus }}
    steps:
      - name: Get latest version
        id: latestVersion
        uses: pozetroninc/github-action-get-latest-release@master
        with:
          owner: seabopo
          repo: psPodTester
          excludes: prerelease, draft
      - name: Determine if release supports Linux/macOS builds (v1 is Windows-only; v2.0.0+ is cross-platform)
        id: versionGate
        shell: pwsh
        run: |
          $major = [int]( ( "${{ steps.latestVersion.outputs.release }}" -replace '^v','' ) -split '\.' )[0]
          $isV2Plus = $major -ge 2
          Write-Host "Release: ${{ steps.latestVersion.outputs.release }} | Major: $major | Linux/macOS builds enabled: $isV2Plus"
          "is_v2_plus=$($isV2Plus.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  windows2022:
    name: Build Windows Server 2022 Image
    runs-on: windows-2022
    needs: getReleaseVersion
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restart Docker Service
        # Works around a known windows-2022/windows-2025 runner issue where the Docker service can fail to
        # create its Hyper-V virtual switch on boot ("hnsCall failed ... system cannot find the file specified"),
        # leaving the docker_engine named pipe unreachable. Restarting the service reliably clears it.
        # https://github.com/actions/runner-images/issues/13729
        shell: powershell
        run: Restart-Service -Name docker -Force
      - name: Build and Push Docker Image
        uses: mr-smithers-excellent/docker-build-push@v7
        with:
          image: seabopo/pspodtester
          tags: ${{ github.run_id }}-${{ github.run_number }}-nanoserver-ltsc2022-${{ env.RELEASE }},nanoserver-ltsc2022-${{ env.RELEASE }},nanoserver-ltsc2022
          registry: docker.io
          dockerfile: ./docker/windows2022/dockerfile
          buildArgs: BASE_IMAGE=mcr.microsoft.com/dotnet/sdk:10.0-nanoserver-ltsc2022, APP_VERSION=${{ env.RELEASE }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          RELEASE: ${{ needs.getReleaseVersion.outputs.release_version }}

  windows2025:
    name: Build Windows Server 2025 Image
    runs-on: windows-2025
    needs: getReleaseVersion
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restart Docker Service
        # See windows2022 job above for why this is here.
        # https://github.com/actions/runner-images/issues/13729
        shell: powershell
        run: Restart-Service -Name docker -Force
      - name: Build and Push Docker Image
        uses: mr-smithers-excellent/docker-build-push@v7
        with:
          image: seabopo/pspodtester
          tags: ${{ github.run_id }}-${{ github.run_number }}-nanoserver-ltsc2025-${{ env.RELEASE }},nanoserver-ltsc2025-${{ env.RELEASE }},nanoserver-ltsc2025
          registry: docker.io
          dockerfile: ./docker/windows2025/dockerfile
          buildArgs: BASE_IMAGE=mcr.microsoft.com/dotnet/sdk:10.0-nanoserver-ltsc2025, APP_VERSION=${{ env.RELEASE }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          RELEASE: ${{ needs.getReleaseVersion.outputs.release_version }}

  macos:
    name: Build macOS (Linux/Ubuntu Noble) Multi-Arch Image
    runs-on: ubuntu-latest
    needs: getReleaseVersion
    if: needs.getReleaseVersion.outputs.is_v2_plus == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./docker/macos
          file: ./docker/macos/dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE_IMAGE=mcr.microsoft.com/dotnet/sdk:10.0-noble
            APP_VERSION=${{ needs.getReleaseVersion.outputs.release_version }}
          tags: |
            seabopo/pspodtester:${{ github.run_id }}-${{ github.run_number }}-noble-${{ needs.getReleaseVersion.outputs.release_version }}
            seabopo/pspodtester:noble-${{ needs.getReleaseVersion.outputs.release_version }}
            seabopo/pspodtester:noble

  linux:
    name: Build Linux (Azure Linux) Multi-Arch Image
    runs-on: ubuntu-latest
    needs: getReleaseVersion
    if: needs.getReleaseVersion.outputs.is_v2_plus == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./docker/linux
          file: ./docker/linux/dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE_IMAGE=mcr.microsoft.com/dotnet/sdk:10.0-azurelinux3.0
            APP_VERSION=${{ needs.getReleaseVersion.outputs.release_version }}
          tags: |
            seabopo/pspodtester:${{ github.run_id }}-${{ github.run_number }}-azurelinux3.0-${{ needs.getReleaseVersion.outputs.release_version }}
            seabopo/pspodtester:azurelinux3.0-${{ needs.getReleaseVersion.outputs.release_version }}
            seabopo/pspodtester:azurelinux3.0

  multiarch:
    name: Build Combined Multi-Arch Manifest
    needs: [getReleaseVersion, windows2022, windows2025, macos, linux]
    if: |
      always() &&
      needs.windows2022.result == 'success' &&
      needs.windows2025.result == 'success'
    # Combining manifests is pure registry-API metadata work - it doesn't build or emulate anything - so this
    # doesn't need a Windows runner. It runs on ubuntu-latest specifically because `docker manifest create` can't
    # amend a manifest list (which `noble`/`azurelinux3.0` are, being multi-arch buildx builds - see below), and
    # `docker buildx imagetools create` (which can) needs a reliably current buildx, same as the macos/linux jobs.
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: BUILD and PUSH latest
        shell: bash
        run: |
          refs=(
            "seabopo/pspodtester:nanoserver-ltsc2022-${RELEASE}"
            "seabopo/pspodtester:nanoserver-ltsc2025-${RELEASE}"
          )
          if [ "${IS_V2_PLUS}" = "true" ]; then
            refs+=("seabopo/pspodtester:noble-${RELEASE}")
          fi
          echo "Combining: ${refs[*]}"
          docker buildx imagetools create --tag seabopo/pspodtester:latest "${refs[@]}"
        env:
          RELEASE: ${{ needs.getReleaseVersion.outputs.release_version }}
          IS_V2_PLUS: ${{ needs.getReleaseVersion.outputs.is_v2_plus }}
